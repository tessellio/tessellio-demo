[package]
name = "tessellio-demo-sender"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The demo's sender: a captured surface, encoded by the Tessellio codec and measured."
license = "Apache-2.0"
publish = false

[dependencies]
# The published codec, pinned by revision: the demo consumes it the way any
# consumer does, and never carries a copy of it.
tessellio-core = { git = "https://github.com/tessellio/tessellio-core", rev = "37c639095658717ca519b3e0955fe3f02f22da7b" }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_arguments = "allow"
